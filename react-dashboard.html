<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APSIT ISMS - React Student Dashboard</title>
    <link rel="icon" type="image/jpg" href="favicon.jpg">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #f3f6fb;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1e293b;
        }
        .navbar-brand {
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .bg-apsit-navy {
            background: #0f2744 !important;
        }
        .sidebar {
            min-height: calc(100vh - 60px);
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
        }
        .sidebar .nav-link {
            color: #475569;
            font-weight: 600;
            font-size: 14px;
            padding: 11px 16px;
            border-radius: 10px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar .nav-link:hover {
            background-color: #f1f5f9;
            color: #0f2744;
        }
        .sidebar .nav-link.active {
            background: #0f2744;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(15, 39, 68, 0.2);
        }
        .welcome-card {
            background: linear-gradient(135deg, #0f2744 0%, #174275 60%, #1e5ba3 100%);
            color: white;
            border-radius: 16px;
        }
        .course-card {
            border-radius: 14px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            background: #ffffff;
            height: 100%;
        }
        .course-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(15, 39, 68, 0.08);
        }
        .section-card {
            border-radius: 14px;
            border: 1px solid #e2e8f0;
        }
        /* ID Card Preview Styles */
        .id-card-wrap {
            font-family: 'Inter', sans-serif;
            width: 340px;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #0f2744;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            margin: auto;
        }
        .id-card-header {
            background-color: #0a1c3a;
            color: #ffffff;
            display: flex;
            align-items: center;
            padding: 18px 20px;
        }
        .logo-badge {
            background-color: #f3ad06;
            color: #000000;
            font-weight: 800;
            font-size: 15px;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
        }
        .id-strip {
            background-color: #f3ad06;
            color: #0a1c3a;
            font-size: 11px;
            font-weight: 800;
            text-align: center;
            padding: 6px 0;
            letter-spacing: 0.5px;
        }
        .id-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .id-photo-ring {
            border: 2px dashed #f3ad06;
            border-radius: 50%;
            padding: 5px;
            display: inline-block;
        }
        .barcode {
            font-size: 12px;
            letter-spacing: 1px;
            font-weight: 900;
            transform: scaleY(3);
            color: #475569;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Student & Attendance Data Source -->
    <script src="studentsData.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- React Application Component Script -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [currentStudent, setCurrentStudent] = useState(() => getCurrentUser());
            const isFacultyAuth = isFacultyRole();
            const [activeTab, setActiveTab] = useState(() => {
                const p = new URLSearchParams(window.location.search);
                if (p.get('view') === 'faculty' && isFacultyRole()) return 'faculty';
                return 'dashboard';
            });
            const [activeModal, setActiveModal] = useState(null); // 'ed', 'evs', etc.
            const [selectedFaculty, setSelectedFaculty] = useState(() => getCurrentFaculty() || FACULTY_LIST[1]);
            const [rosterSearch, setRosterSearch] = useState('');
            const [rosterFilter, setRosterFilter] = useState('all');
            const [facultyEditModal, setFacultyEditModal] = useState(null); // { type: 'attendance'|'grade', student }
            const [editAttended, setEditAttended] = useState(0);
            const [editConducted, setEditConducted] = useState(20);
            const [editTW, setEditTW] = useState(20);
            const [editGrade, setEditGrade] = useState('A+');
            const [editIat1, setEditIat1] = useState(18);
            const [editIat2, setEditIat2] = useState(18);
            const [editStatus, setEditStatus] = useState('Completed');
            const [refreshTick, setRefreshTick] = useState(0);

            useEffect(() => {
                if (!currentStudent) {
                    const fallback = getLiveStudents()[0];
                    if (fallback) setCurrentStudent(fallback);
                    else window.location.href = 'index.html';
                }
            }, [currentStudent]);

            useEffect(() => {
                const handleStorage = (e) => {
                    if (e.key === 'apsit_isms_dynamic_students' || e.key === 'apsit_current_user') {
                        const fresh = getCurrentUser();
                        if (fresh) setCurrentStudent(fresh);
                        setRefreshTick(t => t + 1);
                    }
                };
                window.addEventListener('storage', handleStorage);
                return () => window.removeEventListener('storage', handleStorage);
            }, []);

            const liveStudents = useMemo(() => {
                return getLiveStudents();
            }, [refreshTick]);

            const compliance = useMemo(() => {
                if (!currentStudent) return null;
                const conducted = 146;
                const attended = currentStudent.attendance.theoryTotal.attended;
                const overallPct = currentStudent.attendance.overallPct;
                if (overallPct >= 75) {
                    const safeMiss = Math.max(0, Math.floor(attended / 0.75 - conducted));
                    return {
                        isSafe: true,
                        safeMiss,
                        needed: 0,
                        statusBadge: 'Term-Work & Exam Approved',
                        statusClass: 'bg-success',
                        note: `You can safely miss up to ${safeMiss} upcoming lectures while remaining above the mandatory 75% threshold.`
                    };
                } else {
                    const needed = Math.max(1, Math.ceil(3 * conducted - 4 * attended));
                    return {
                        isSafe: false,
                        safeMiss: 0,
                        needed,
                        statusBadge: overallPct >= 60 ? 'Warning: Defaulter Risk' : 'Critical Shortage',
                        statusClass: overallPct >= 60 ? 'bg-warning text-dark' : 'bg-danger',
                        note: `You must attend the next ${needed} consecutive lectures without absence to bring your attendance back to 75%.`
                    };
                }
            }, [currentStudent]);

            if (!currentStudent) {
                return (
                    <div class="d-flex align-items-center justify-content-center vh-100 bg-light">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    {/* Top Navbar */}
                    <nav class="navbar navbar-expand-lg navbar-dark bg-apsit-navy sticky-top py-2 px-3">
                        <div class="container-fluid">
                            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                                <i class="bi bi-mortarboard-fill text-warning fs-4"></i>
                                <span>APSIT ISMS <span class="badge bg-primary text-light small fw-normal ms-1">React Edition</span></span>
                            </a>

                            <div class="d-flex align-items-center gap-2 gap-md-3">
                                {/* Academic Calendar Notifications Dropdown */}
                                <div class="dropdown">
                                    <button class="btn btn-sm btn-outline-light dropdown-toggle d-flex align-items-center gap-1" data-bs-toggle="dropdown">
                                        <i class="bi bi-bell-fill text-warning"></i>
                                        <span class="d-none d-md-inline">Notifications</span>
                                        <span class="badge bg-danger rounded-pill">16</span>
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-end shadow-lg p-2" style={{ width: '340px', maxHeight: '450px', overflowY: 'auto' }}>
                                        <li class="d-flex justify-content-between align-items-center px-2 py-1 mb-2 border-bottom">
                                            <h6 class="dropdown-header text-primary fw-bold p-0 mb-0">Upcoming Academic Calendar</h6>
                                            <span class="badge bg-primary-subtle text-primary">Sem III 2026</span>
                                        </li>
                                        {ACADEMIC_CALENDAR_EVENTS.slice(0, 8).map(ev => (
                                            <li key={ev.id}>
                                                <a class="dropdown-item py-2 px-2 rounded" href="dashboard1.html">
                                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                                        <span class={`badge ${ev.badge} small`}>{ev.type}</span>
                                                        <small class="text-muted fw-semibold">{ev.date}</small>
                                                    </div>
                                                    <h6 class="mb-1 text-wrap fw-semibold small text-dark">{ev.title}</h6>
                                                    <small class="text-muted d-block text-truncate" style={{ maxWidth: '300px' }}>{ev.desc}</small>
                                                </a>
                                                <hr class="dropdown-divider my-1" />
                                            </li>
                                        ))}
                                        <li class="text-center pt-1">
                                            <a class="small text-decoration-none fw-semibold text-primary" href="dashboard1.html">
                                                View Complete Academic Calendar <i class="bi bi-arrow-right"></i>
                                            </a>
                                        </li>
                                    </ul>
                                </div>

                                {/* Faculty Portal Direct Button (Only for Authorized Faculty) */}
                                {isFacultyAuth && (
                                    <button 
                                        class={`btn btn-sm ${activeTab === 'faculty' ? 'btn-warning text-dark fw-bold' : 'btn-outline-warning text-white fw-bold'} d-flex align-items-center gap-1`}
                                        onClick={() => setActiveTab('faculty')}
                                    >
                                        <i class="bi bi-person-workspace"></i>
                                        <span>Faculty Portal</span>
                                    </button>
                                )}
                                
                                {/* Profile Dropdown */}
                                <div class="dropdown">
                                    <button class="btn btn-sm btn-light dropdown-toggle d-flex align-items-center gap-2 fw-semibold" data-bs-toggle="dropdown">
                                        <i class={`bi ${isFacultyAuth ? 'bi-person-badge-fill text-warning' : 'bi-person-circle text-primary'} fs-5`}></i>
                                        <span class="d-none d-sm-inline">{isFacultyAuth ? selectedFaculty.title : currentStudent.name}</span>
                                        <span class={`badge ${isFacultyAuth ? 'bg-warning text-dark' : 'bg-primary text-white'}`}>{isFacultyAuth ? 'Faculty' : currentStudent.moodleId}</span>
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                                        <li class="px-3 py-2 border-bottom">
                                            <div class="fw-bold">{isFacultyAuth ? selectedFaculty.title : currentStudent.fullName}</div>
                                            <small class="text-muted">{isFacultyAuth ? `${selectedFaculty.subjectName} • ${selectedFaculty.email}` : `Roll: ${currentStudent.rollNo} • SE IT Div B`}</small>
                                        </li>
                                        {!isFacultyAuth && (
                                            <li>
                                                <button class="dropdown-item py-2" onClick={() => setActiveModal('idCard')}>
                                                    <i class="bi bi-person-badge text-primary me-2"></i> View ID Card
                                                </button>
                                            </li>
                                        )}
                                        <li>
                                            <a class="dropdown-item py-2" href={isFacultyAuth ? "dashboard1.html?view=faculty" : "dashboard1.html"}>
                                                <i class="bi bi-layout-text-window text-secondary me-2"></i> Classic HTML Version
                                            </a>
                                        </li>
                                        <li><hr class="dropdown-divider" /></li>
                                        <li>
                                            <button class="dropdown-item py-2 text-danger fw-semibold" onClick={isFacultyAuth ? logoutFaculty : logoutStudent}>
                                                <i class="bi bi-box-arrow-right me-2"></i> Logout
                                            </button>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <div class="container-fluid">
                        <div class="row">
                            {/* Sidebar */}
                            <aside class="col-md-3 col-lg-2 sidebar p-3">
                                <div class="text-uppercase small fw-bold text-muted px-2 mb-2">Main Navigation</div>
                                <ul class="nav flex-column">
                                    <li class="nav-item">
                                        <a class={`nav-link ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>
                                            <span><i class="bi bi-speedometer2 me-2"></i> Dashboard</span>
                                        </a>
                                    </li>
                                    <li class="nav-item">
                                        <a class={`nav-link ${activeTab === 'courses' ? 'active' : ''}`} onClick={() => setActiveTab('courses')}>
                                            <span><i class="bi bi-book me-2"></i> My Courses</span>
                                            <span class="badge bg-light text-dark">10</span>
                                        </a>
                                    </li>
                                    <li class="nav-item">
                                        <a class={`nav-link ${activeTab === 'attendance' ? 'active' : ''}`} onClick={() => setActiveTab('attendance')}>
                                            <span><i class="bi bi-calendar-check me-2"></i> Attendance</span>
                                            <span class={`badge ${currentStudent.attendance.overallPct >= 75 ? 'bg-success' : 'bg-danger'}`}>
                                                {currentStudent.attendance.overallPct}%
                                            </span>
                                        </a>
                                    </li>
                                    <li class="nav-item">
                                        <a class={`nav-link ${activeTab === 'grades' ? 'active' : ''}`} onClick={() => setActiveTab('grades')}>
                                            <span><i class="bi bi-award me-2"></i> Grades & Marks</span>
                                        </a>
                                    </li>
                                    {isFacultyAuth && (
                                        <li class="nav-item">
                                            <a class={`nav-link text-success fw-bold ${activeTab === 'faculty' ? 'active text-white' : ''}`} onClick={() => setActiveTab('faculty')}>
                                                <span><i class="bi bi-person-workspace me-2"></i> Faculty Portal</span>
                                                <span class="badge bg-success">Live</span>
                                            </a>
                                        </li>
                                    )}
                                </ul>

                                <hr />
                                <div class="text-uppercase small fw-bold text-muted px-2 mb-2">My Profile</div>
                                <div class="p-2 bg-light rounded text-center">
                                    <small class="d-block text-muted">Signed in as</small>
                                    <strong class="d-block text-primary text-truncate">{currentStudent.name}</strong>
                                    <span class="badge bg-secondary-subtle text-secondary small mt-1">{currentStudent.rollNo}</span>
                                    <button class="btn btn-outline-primary btn-sm w-100 mt-2" onClick={() => setActiveModal('idCard')}>
                                        <i class="bi bi-person-badge me-1"></i> View ID Card
                                    </button>
                                </div>
                            </aside>

                            {/* Main Content Area */}
                            <main class="col-md-9 col-lg-10 p-4">
                                {activeTab === 'dashboard' && (
                                    <div>
                                        {/* Welcome Banner */}
                                        <div class="card welcome-card p-4 mb-4 border-0 shadow-sm">
                                            <div class="row align-items-center">
                                                <div class="col-md-8">
                                                    <div class="d-flex align-items-center gap-2 mb-2">
                                                        <span class="badge bg-warning text-dark fw-bold px-3 py-1">SE IT DIV B</span>
                                                        <span class="badge bg-light text-primary fw-semibold">
                                                            Overall Attendance: {currentStudent.attendance.overallPct}% ({currentStudent.attendance.overallPct >= 75 ? 'Eligible' : 'Defaulter Risk'})
                                                        </span>
                                                    </div>
                                                    <h2 class="fw-bold mb-1">Welcome back, {currentStudent.name}!</h2>
                                                    <p class="mb-2 text-light opacity-90">
                                                        Roll No: <strong>{currentStudent.rollNo}</strong> | Moodle ID: <strong>{currentStudent.moodleId}</strong> | Semester III
                                                    </p>
                                                    <p class="mb-0 small text-light opacity-75">
                                                        Access your syllabus, detailed attendance statistics, safe margin calculator, and grades built with React &amp; Spring Boot.
                                                    </p>
                                                </div>
                                                <div class="col-md-4 text-md-end mt-3 mt-md-0">
                                                    <i class="bi bi-mortarboard-fill" style={{ fontSize: '80px', opacity: 0.9 }}></i>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Academic Overview Metric Cards */}
                                        <h4 class="fw-bold mb-3">Academic & Attendance Overview</h4>
                                        <div class="row g-4 mb-4">
                                            <div class="col-sm-6 col-lg-3">
                                                <div class="card section-card p-3 text-center shadow-sm h-100">
                                                    <i class="bi bi-book fs-1 text-primary"></i>
                                                    <h3 class="mt-2 fw-bold">10</h3>
                                                    <small class="text-muted text-uppercase fw-semibold">Enrolled Courses</small>
                                                    <span class="small text-secondary">Sem III IT</span>
                                                </div>
                                            </div>
                                            <div class="col-sm-6 col-lg-3">
                                                <div class="card section-card p-3 text-center shadow-sm h-100">
                                                    <i class="bi bi-person-check fs-1 text-success"></i>
                                                    <h3 class="mt-2 fw-bold">{currentStudent.attendance.theoryTotal.attended} / 146</h3>
                                                    <small class="text-muted text-uppercase fw-semibold">Theory Attendance</small>
                                                    <span class="small text-success fw-bold">{currentStudent.attendance.theoryTotal.pct}% Attended</span>
                                                </div>
                                            </div>
                                            <div class="col-sm-6 col-lg-3">
                                                <div class="card section-card p-3 text-center shadow-sm h-100">
                                                    <i class="bi bi-pc-display fs-1 text-info"></i>
                                                    <h3 class="mt-2 fw-bold">{currentStudent.attendance.practicalAvg}%</h3>
                                                    <small class="text-muted text-uppercase fw-semibold">Practical Average</small>
                                                    <span class="small text-info fw-bold">Labs & Practicals</span>
                                                </div>
                                            </div>
                                            <div class="col-sm-6 col-lg-3">
                                                <div class="card section-card p-3 text-center shadow-sm h-100">
                                                    <i class={`bi bi-award fs-1 ${currentStudent.attendance.overallPct >= 75 ? 'text-warning' : 'text-danger'}`}></i>
                                                    <h3 class="mt-2 fw-bold">{currentStudent.attendance.overallPct}%</h3>
                                                    <small class="text-muted text-uppercase fw-semibold">Overall Attendance</small>
                                                    <span class={`badge ${currentStudent.attendance.overallPct >= 75 ? 'bg-success' : 'bg-danger'}`}>
                                                        {currentStudent.attendance.overallPct >= 75 ? 'Eligible (Safe)' : 'Defaulter Warning'}
                                                    </span>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Quick Course Syllabus Access */}
                                        <div class="card section-card p-4 shadow-sm mb-4">
                                            <div class="d-flex justify-content-between align-items-center mb-3">
                                                <div>
                                                    <h5 class="fw-bold mb-0"><i class="bi bi-journal-bookmark-fill text-primary me-2"></i>Official Syllabi &amp; Experiment Manuals</h5>
                                                    <small class="text-muted">Updated as per University syllabus specifications &amp; faculty plan</small>
                                                </div>
                                                <button class="btn btn-outline-primary btn-sm" onClick={() => setActiveTab('courses')}>View All Courses</button>
                                            </div>
                                            <div class="row g-3">
                                                <div class="col-md-6 col-lg-4">
                                                    <div class="border rounded p-3 bg-light d-flex flex-column justify-content-between h-100">
                                                        <div>
                                                            <div class="d-flex justify-content-between align-items-center mb-1">
                                                                <span class="badge bg-warning-subtle text-dark border">Course 2993511</span>
                                                                <span class="badge bg-light text-muted border">2 Credits</span>
                                                            </div>
                                                            <h6 class="fw-bold mb-1">Entrepreneurship Development</h6>
                                                            <small class="text-muted d-block mb-2">Modules 0–VI • 10 Experiments • 6 Assignments • Term Work: 50M</small>
                                                        </div>
                                                        <button class="btn btn-primary btn-sm w-100" onClick={() => setActiveModal('ed')}>
                                                            <i class="bi bi-eye me-1"></i> View Syllabus
                                                        </button>
                                                    </div>
                                                </div>
                                                <div class="col-md-6 col-lg-4">
                                                    <div class="border rounded p-3 bg-light d-flex flex-column justify-content-between h-100">
                                                        <div>
                                                            <div class="d-flex justify-content-between align-items-center mb-1">
                                                                <span class="badge bg-success-subtle text-success border">Course 2993512</span>
                                                                <span class="badge bg-light text-muted border">2 Credits</span>
                                                            </div>
                                                            <h6 class="fw-bold mb-1">Environmental Science</h6>
                                                            <small class="text-muted d-block mb-2">Units I–VI • 12 Experiments • 10 Assignments • Term Work: 50M</small>
                                                        </div>
                                                        <button class="btn btn-success btn-sm text-white w-100" onClick={() => setActiveModal('evs')}>
                                                            <i class="bi bi-eye me-1"></i> View Syllabus
                                                        </button>
                                                    </div>
                                                </div>
                                                <div class="col-md-6 col-lg-4">
                                                    <div class="border rounded p-3 bg-light d-flex flex-column justify-content-between h-100">
                                                        <div>
                                                            <div class="d-flex justify-content-between align-items-center mb-1">
                                                                <span class="badge bg-info-subtle text-dark border">Course 2343112</span>
                                                                <span class="badge bg-light text-muted border">3 Credits</span>
                                                            </div>
                                                            <h6 class="fw-bold mb-1">Advance Data Structure &amp; Analysis</h6>
                                                            <small class="text-muted d-block mb-2">Modules 0–VI • Theory 3 Hrs • IAT: 40M • ESE: 60M (100M)</small>
                                                        </div>
                                                        <button class="btn btn-info btn-sm text-dark w-100 fw-semibold" onClick={() => setActiveModal('adsa')}>
                                                            <i class="bi bi-eye me-1"></i> View Syllabus
                                                        </button>
                                                    </div>
                                                </div>
                                                <div class="col-md-6 col-lg-6">
                                                    <div class="border rounded p-3 bg-light d-flex flex-column justify-content-between h-100">
                                                        <div>
                                                            <div class="d-flex justify-content-between align-items-center mb-1">
                                                                <span class="badge bg-danger-subtle text-danger border">Course 2343113</span>
                                                                <span class="badge bg-light text-muted border">3 Credits</span>
                                                            </div>

                                    <div class="modal-body p-4">
                                        <div class="p-3 bg-light rounded mb-3 border">
                                            <div class="fw-bold fs-6 text-dark">{facultyEditModal.student.name}</div>
                                            <div class="small text-muted">
                                                Roll No: <strong>{facultyEditModal.student.rollNo}</strong> | Moodle ID: <strong class="text-primary">{facultyEditModal.student.moodleId}</strong>
                                            </div>
                                            <div class="small text-secondary mt-1">
                                                Course: <strong>{selectedFaculty.subjectName}</strong>
                                            </div>
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label fw-bold">Lectures Conducted</label>
                                            <input 
                                                type="number" 
                                                class="form-control" 
                                                min="1" 
                                                max="100" 
                                                value={editConducted}
                                                onChange={(e) => setEditConducted(parseInt(e.target.value) || 0)}
                                            />
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label fw-bold">Lectures Attended</label>
                                            <div class="input-group">
                                                <button 
                                                    class="btn btn-outline-secondary" 
                                                    type="button"
                                                    onClick={() => setEditAttended(Math.max(0, editAttended - 1))}
                                                >
                                                    <i class="bi bi-dash"></i>
                                                </button>
                                                <input 
                                                    type="number" 
                                                    class="form-control text-center fw-bold fs-5" 
                                                    min="0" 
                                                    max={editConducted} 
                                                    value={editAttended}
                                                    onChange={(e) => setEditAttended(parseInt(e.target.value) || 0)}
                                                />
                                                <button 
                                                    class="btn btn-outline-secondary" 
                                                    type="button"
                                                    onClick={() => setEditAttended(Math.min(editConducted, editAttended + 1))}
                                                >
                                                    <i class="bi bi-plus"></i>
                                                </button>
                                            </div>
                                        </div>

                                        {(() => {
                                            const pct = editConducted > 0 ? Math.round((editAttended / editConducted) * 100) : 0;
                                            const badgeColor = pct >= 75 ? 'bg-success' : (pct >= 60 ? 'bg-warning text-dark' : 'bg-danger');
                                            return (
                                                <div class="alert alert-secondary d-flex justify-content-between align-items-center py-2 mb-0">
                                                    <span>Computed Percentage:</span>
                                                    <span class={`badge ${badgeColor} fs-6`}>{pct}%</span>
                                                </div>
                                            );
                                        })()}
                                    </div>
                                    <div class="modal-footer">
                                        <button class="btn btn-outline-secondary" onClick={() => setFacultyEditModal(null)}>Cancel</button>
                                        <button 
                                            class="btn btn-primary"
                                            onClick={() => {
                                                const res = updateStudentAttendanceByFaculty(
                                                    facultyEditModal.student.moodleId,
                                                    selectedFaculty.subjectKey,
                                                    editAttended,
                                                    editConducted
                                                );
                                                if (res) {
                                                    const updated = getCurrentUser();
                                                    if (updated && updated.moodleId === currentStudent.moodleId) {
                                                        setCurrentStudent(updated);
                                                    }
                                                    setRefreshTick(t => t + 1);
                                                    setFacultyEditModal(null);
                                                }
                                            }}
                                        >
                                            <i class="bi bi-check2-circle me-1"></i> Save Changes
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Faculty Edit Grade Modal */}
                    {facultyEditModal && facultyEditModal.type === 'grade' && (
                        <div class="modal d-block" tabIndex="-1" style={{ backgroundColor: 'rgba(0,0,0,0.6)' }}>
                            <div class="modal-dialog modal-dialog-centered">
                                <div class="modal-content shadow">
                                    <div class="modal-header bg-success text-white">
                                        <h5 class="modal-title fw-bold">
                                            <i class="bi bi-award me-2"></i> Update Academic Marks &amp; Grade
                                        </h5>
                                        <button class="btn-close btn-close-white" onClick={() => setFacultyEditModal(null)}></button>
                                    </div>
                                    <div class="modal-body p-4">
                                        <div class="p-3 bg-light rounded mb-3 border">
                                            <div class="fw-bold fs-6 text-dark">{facultyEditModal.student.name}</div>
                                            <div class="small text-muted">
                                                Roll No: <strong>{facultyEditModal.student.rollNo}</strong> | Moodle ID: <strong class="text-primary">{facultyEditModal.student.moodleId}</strong>
                                            </div>
                                            <div class="small text-secondary mt-1">
                                                Course: <strong>{selectedFaculty.subjectName}</strong>
                                            </div>
                                        </div>

                                        <div class="row g-2 mb-3">
                                            <div class="col-6">
                                                <label class="form-label fw-bold small">Term Work (Max 25)</label>
                                                <input 
                                                    type="number" 
                                                    class="form-control" 
                                                    min="0" 
                                                    max="25" 
                                                    value={editTW}
                                                    onChange={(e) => setEditTW(parseInt(e.target.value) || 0)}
                                                />
                                            </div>
                                            <div class="col-6">
                                                <label class="form-label fw-bold small">Letter Grade</label>
                                                <select 
                                                    class="form-select" 
                                                    value={editGrade}
                                                    onChange={(e) => setEditGrade(e.target.value)}
                                                >
                                                    <option value="O">O (Outstanding)</option>
                                                    <option value="A+">A+ (Excellent)</option>
                                                    <option value="A">A (Very Good)</option>
                                                    <option value="B+">B+ (Good)</option>
                                                    <option value="B">B (Above Average)</option>
                                                    <option value="C">C (Pass)</option>
                                                    <option value="F">F (Fail)</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div class="row g-2 mb-3">
                                            <div class="col-6">
                                                <label class="form-label fw-bold small">IAT-1 (Max 20)</label>
                                                <input 
                                                    type="number" 
                                                    class="form-control" 
                                                    min="0" 
                                                    max="20" 
                                                    value={editIat1}
                                                    onChange={(e) => setEditIat1(parseInt(e.target.value) || 0)}
                                                />
                                            </div>
                                            <div class="col-6">
                                                <label class="form-label fw-bold small">IAT-2 (Max 20)</label>
                                                <input 
                                                    type="number" 
                                                    class="form-control" 
                                                    min="0" 
                                                    max="20" 
                                                    value={editIat2}
                                                    onChange={(e) => setEditIat2(parseInt(e.target.value) || 0)}
                                                />
                                            </div>
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label fw-bold small">Status</label>
                                            <select 
                                                class="form-select" 
                                                value={editStatus}
                                                onChange={(e) => setEditStatus(e.target.value)}
                                            >
                                                <option value="Completed">Completed</option>
                                                <option value="In Progress">In Progress</option>
                                                <option value="Pending Submission">Pending Submission</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button class="btn btn-outline-secondary" onClick={() => setFacultyEditModal(null)}>Cancel</button>
                                        <button 
                                            class="btn btn-success"
                                            onClick={() => {
                                                const res = updateStudentGradeByFaculty(
                                                    facultyEditModal.student.moodleId,
                                                    selectedFaculty.subjectKey,
                                                    {
                                                        termWork: editTW,
                                                        maxTermWork: 25,
                                                        grade: editGrade,
                                                        iat1: editIat1,
                                                        iat2: editIat2,
                                                        status: editStatus
                                                    }
                                                );
                                                if (res) {
                                                    const updated = getCurrentUser();
                                                    if (updated && updated.moodleId === currentStudent.moodleId) {
                                                        setCurrentStudent(updated);
                                                    }
                                                    setRefreshTick(t => t + 1);
                                                    setFacultyEditModal(null);
                                                }
                                            }}
                                        >
                                            <i class="bi bi-check2-circle me-1"></i> Save Grade
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

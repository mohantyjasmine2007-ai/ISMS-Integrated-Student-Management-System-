<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APSIT ISMS - React Student Dashboard</title>
    <link rel="icon" type="image/jpg" href="favicon.jpg">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #f3f6fb;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1e293b;
        }
        .navbar-brand {
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .bg-apsit-navy {
            background: #0f2744 !important;
        }
        .sidebar {
            min-height: calc(100vh - 60px);
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
        }
        .sidebar .nav-link {
            color: #475569;
            font-weight: 600;
            font-size: 14px;
            padding: 11px 16px;
            border-radius: 10px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar .nav-link:hover {
            background-color: #f1f5f9;
            color: #0f2744;
        }
        .sidebar .nav-link.active {
            background: #0f2744;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(15, 39, 68, 0.2);
        }
        .welcome-card {
            background: linear-gradient(135deg, #0f2744 0%, #174275 60%, #1e5ba3 100%);
            color: white;
            border-radius: 16px;
        }
        .course-card {
            border-radius: 14px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            background: #ffffff;
            height: 100%;
        }
        .course-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(15, 39, 68, 0.08);
        }
        .section-card {
            border-radius: 14px;
            border: 1px solid #e2e8f0;
        }
        /* ID Card Preview Styles */
        .id-card-wrap {
            font-family: 'Inter', sans-serif;
            width: 340px;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #0f2744;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            margin: auto;
        }
        .id-card-header {
            background-color: #0a1c3a;
            color: #ffffff;
            display: flex;
            align-items: center;
            padding: 18px 20px;
        }
        .logo-badge {
            background-color: #f3ad06;
            color: #000000;
            font-weight: 800;
            font-size: 15px;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
        }
        .id-strip {
            background-color: #f3ad06;
            color: #0a1c3a;
            font-size: 11px;
            font-weight: 800;
            text-align: center;
            padding: 6px 0;
            letter-spacing: 0.5px;
        }
        .id-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .id-photo-ring {
            border: 2px dashed #f3ad06;
            border-radius: 50%;
            padding: 5px;
            display: inline-block;
        }
        .barcode {
            font-size: 12px;
            letter-spacing: 1px;
            font-weight: 900;
            transform: scaleY(3);
            color: #475569;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Student & Attendance Data Source -->
    <script src="studentsData.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- React Application Component Script -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [currentStudent, setCurrentStudent] = useState(() => getCurrentUser());
            const [activeTab, setActiveTab] = useState('dashboard');
            const [activeModal, setActiveModal] = useState(null); // 'ed', 'evs', 'idCard'

            useEffect(() => {
                if (!currentStudent) {
                    window.location.href = 'index.html';
                }
            }, [currentStudent]);

            const compliance = useMemo(() => {
                if (!currentStudent) return null;
                const conducted = 146;
                const attended = currentStudent.attendance.theoryTotal.attended;
                const overallPct = currentStudent.attendance.overallPct;
                if (overallPct >= 75) {
                    const safeMiss = Math.max(0, Math.floor(attended / 0.75 - conducted));
                    return {
                        isSafe: true,
                        safeMiss,
                        needed: 0,
                        statusBadge: 'Term-Work & Exam Approved',
                        statusClass: 'bg-success',
                        note: `You can safely miss up to ${safeMiss} upcoming lectures while remaining above the mandatory 75% threshold.`
                    };
                } else {
                    const needed = Math.max(1, Math.ceil(3 * conducted - 4 * attended));
                    return {
                        isSafe: false,
                        safeMiss: 0,
                        needed,
                        statusBadge: overallPct >= 60 ? 'Warning: Defaulter Risk' : 'Critical Shortage',
                        statusClass: overallPct >= 60 ? 'bg-warning text-dark' : 'bg-danger',
                        note: `You must attend the next ${needed} consecutive lectures without absence to bring your attendance back to 75%.`
                    };
                }
            }, [currentStudent]);

            if (!currentStudent) {
                return (
                    <div class="d-flex align-items-center justify-content-center vh-100 bg-light">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    {/* Top Navbar */}
                    <nav class="navbar navbar-expand-lg navbar-dark bg-apsit-navy sticky-top py-2 px-3">
                        <div class="container-fluid">
                            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                                <i class="bi bi-mortarboard-fill text-warning fs-4"></i>
                                <span>APSIT ISMS <span class="badge bg-primary text-light small fw-normal ms-1">React Edition</span></span>
                            </a>

                            <div class="d-flex align-items-center gap-3">
                                
                                <div class="dropdown">
                                    <button class="btn btn-sm btn-light dropdown-toggle d-flex align-items-center gap-2 fw-semibold" data-bs-toggle="dropdown">
                                        <i class="bi bi-person-circle fs-5 text-primary"></i>
                                        <span>{currentStudent.name}</span>
                                        <span class="badge bg-primary text-white">{currentStudent.moodleId}</span>
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                                        <li class="px-3 py-2 border-bottom">
                                            <div class="fw-bold">{currentStudent.fullName}</div>
                                            <small class="text-muted">Roll: {currentStudent.rollNo} • SE IT Div B</small>
                                        </li>
                                        <li>
                                            <button class="dropdown-item py-2" onClick={() => setActiveModal('idCard')}>
                                                <i class="bi bi-person-badge text-primary me-2"></i> View ID Card
                                            </button>
                                        </li>
                                        <li>
                                            <a class="dropdown-item py-2" href="dashboard1.html">
                                                <i class="bi bi-layout-text-window text-secondary me-2"></i> Classic HTML Version
                                            </a>
                                        </li>
                                        <li><hr class="dropdown-divider" /></li>
                                        <li>
                                            <button class="dropdown-item py-2 text-danger fw-semibold" onClick={logoutStudent}>
                                                <i class="bi bi-box-arrow-right me-2"></i> Logout
                                            </button>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <div class="container-fluid">
                        <div class="row">
                            {/* Sidebar */}
                            <aside class="col-md-3 col-lg-2 sidebar p-3">
                                <div class="text-uppercase small fw-bold text-muted px-2 mb-2">Main Navigation</div>
                                <ul class="nav flex-column">
                                    <li class="nav-item">
                                        <a class={`nav-link ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>
                                            <span><i class="bi bi-speedometer2 me-2"></i> Dashboard</span>
                                        </a>
                                    </li>
                                    <li class="nav-item">
                                        <a class={`nav-link ${activeTab === 'courses' ? 'active' : ''}`} onClick={() => setActiveTab('courses')}>
                                            <span><i class="bi bi-book me-2"></i> My Courses</span>
                                            <span class="badge bg-light text-dark">10</span>
                                        </a>
                                    </li>
                                    <li class="nav-item">
                                        <a class={`nav-link ${activeTab === 'attendance' ? 'active' : ''}`} onClick={() => setActiveTab('attendance')}>
                                            <span><i class="bi bi-calendar-check me-2"></i> Attendance</span>
                                            <span class={`badge ${currentStudent.attendance.overallPct >= 75 ? 'bg-success' : 'bg-danger'}`}>
                                                {currentStudent.attendance.overallPct}%
                                            </span>
                                        </a>
                                    </li>
                                    <li class="nav-item">
                                        <a class={`nav-link ${activeTab === 'grades' ? 'active' : ''}`} onClick={() => setActiveTab('grades')}>
                                            <span><i class="bi bi-award me-2"></i> Grades & Marks</span>
                                        </a>
                                    </li>
                                </ul>

                                <hr />
                                <div class="text-uppercase small fw-bold text-muted px-2 mb-2">My Profile</div>
                                <div class="p-2 bg-light rounded text-center">
                                    <small class="d-block text-muted">Signed in as</small>
                                    <strong class="d-block text-primary text-truncate">{currentStudent.name}</strong>
                                    <span class="badge bg-secondary-subtle text-secondary small mt-1">{currentStudent.rollNo}</span>
                                    <button class="btn btn-outline-primary btn-sm w-100 mt-2" onClick={() => setActiveModal('idCard')}>
                                        <i class="bi bi-person-badge me-1"></i> View ID Card
                                    </button>
                                </div>
                            </aside>

                            {/* Main Content Area */}
                            <main class="col-md-9 col-lg-10 p-4">
                                {activeTab === 'dashboard' && (
                                    <div>
                                        {/* Welcome Banner */}
                                        <div class="card welcome-card p-4 mb-4 border-0 shadow-sm">
                                            <div class="row align-items-center">
                                                <div class="col-md-8">
                                                    <div class="d-flex align-items-center gap-2 mb-2">
                                                        <span class="badge bg-warning text-dark fw-bold px-3 py-1">SE IT DIV B</span>
                                                        <span class="badge bg-light text-primary fw-semibold">
                                                            Overall Attendance: {currentStudent.attendance.overallPct}% ({currentStudent.attendance.overallPct >= 75 ? 'Eligible' : 'Defaulter Risk'})
                                                        </span>
                                                    </div>
                                                    <h2 class="fw-bold mb-1">Welcome back, {currentStudent.name}!</h2>
                                                    <p class="mb-2 text-light opacity-90">
                                                        Roll No: <strong>{currentStudent.rollNo}</strong> | Moodle ID: <strong>{currentStudent.moodleId}</strong> | Semester III
                                                    </p>
                                                    <p class="mb-0 small text-light opacity-75">
                                                        Access your syllabus, detailed attendance statistics, notes, and grades built with React & Spring Boot.
                                                    </p>
                                                </div>
                                                <div class="col-md-4 text-md-end mt-3 mt-md-0">
                                                    <i class="bi bi-mortarboard-fill" style={{ fontSize: '80px', opacity: 0.9 }}></i>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Academic Overview Metric Cards */}
                                        <h4 class="fw-bold mb-3">Academic & Attendance Overview</h4>
                                        <div class="row g-4 mb-4">
                                            <div class="col-sm-6 col-lg-3">
                                                <div class="card section-card p-3 text-center shadow-sm h-100">
                                                    <i class="bi bi-book fs-1 text-primary"></i>
                                                    <h3 class="mt-2 fw-bold">10</h3>
                                                    <small class="text-muted text-uppercase fw-semibold">Enrolled Courses</small>
                                                    <span class="small text-secondary">Sem III IT</span>
                                                </div>
                                            </div>
                                            <div class="col-sm-6 col-lg-3">
                                                <div class="card section-card p-3 text-center shadow-sm h-100">
                                                    <i class="bi bi-person-check fs-1 text-success"></i>
                                                    <h3 class="mt-2 fw-bold">{currentStudent.attendance.theoryTotal.attended} / 146</h3>
                                                    <small class="text-muted text-uppercase fw-semibold">Theory Attendance</small>
                                                    <span class="small text-success fw-bold">{currentStudent.attendance.theoryTotal.pct}% Attended</span>
                                                </div>
                                            </div>
                                            <div class="col-sm-6 col-lg-3">
                                                <div class="card section-card p-3 text-center shadow-sm h-100">
                                                    <i class="bi bi-pc-display fs-1 text-info"></i>
                                                    <h3 class="mt-2 fw-bold">{currentStudent.attendance.practicalAvg}%</h3>
                                                    <small class="text-muted text-uppercase fw-semibold">Practical Average</small>
                                                    <span class="small text-info fw-bold">Labs & Practicals</span>
                                                </div>
                                            </div>
                                            <div class="col-sm-6 col-lg-3">
                                                <div class="card section-card p-3 text-center shadow-sm h-100">
                                                    <i class={`bi bi-award fs-1 ${currentStudent.attendance.overallPct >= 75 ? 'text-warning' : 'text-danger'}`}></i>
                                                    <h3 class="mt-2 fw-bold">{currentStudent.attendance.overallPct}%</h3>
                                                    <small class="text-muted text-uppercase fw-semibold">Overall Attendance</small>
                                                    <span class={`badge ${currentStudent.attendance.overallPct >= 75 ? 'bg-success' : 'bg-danger'}`}>
                                                        {currentStudent.attendance.overallPct >= 75 ? 'Eligible (Safe)' : 'Defaulter Warning'}
                                                    </span>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Quick Course Syllabus Access */}
                                        <div class="card section-card p-4 shadow-sm mb-4">
                                            <div class="d-flex justify-content-between align-items-center mb-3">
                                                <h5 class="fw-bold mb-0"><i class="bi bi-star-fill text-warning me-2"></i>Updated Syllabi & Practicals</h5>
                                                <button class="btn btn-outline-primary btn-sm" onClick={() => setActiveTab('courses')}>View All 10 Courses</button>
                                            </div>
                                            <div class="row g-3">
                                                <div class="col-md-6">
                                                    <div class="border rounded p-3 bg-light d-flex justify-content-between align-items-center">
                                                        <div>
                                                            <span class="badge bg-warning-subtle text-dark border mb-1">Course 2993511</span>
                                                            <h6 class="fw-bold mb-1">Entrepreneurship Development</h6>
                                                            <small class="text-muted">Detailed Syllabus (Mod 0-VI) • 10 Experiments • 2 Credits</small>
                                                        </div>
                                                        <button class="btn btn-primary btn-sm" onClick={() => setActiveModal('ed')}>
                                                            View Syllabus
                                                        </button>
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <div class="border rounded p-3 bg-light d-flex justify-content-between align-items-center">
                                                        <div>
                                                            <span class="badge bg-success-subtle text-success border mb-1">Course 2993512</span>
                                                            <h6 class="fw-bold mb-1">Environmental Science</h6>
                                                            <small class="text-muted">Detailed Syllabus (Unit I-VI) • 12 Experiments • 2 Credits</small>
                                                        </div>
                                                        <button class="btn btn-success btn-sm text-white" onClick={() => setActiveModal('evs')}>
                                                            View Syllabus
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'courses' && (
                                    <div>
                                        <h3 class="fw-bold mb-3"><i class="bi bi-book-fill text-primary me-2"></i>Semester III Courses & Syllabi</h3>
                                        <div class="row g-4">
                                            {/* ED Card */}
                                            <div class="col-md-6 col-xl-4">
                                                <div class="card course-card shadow-sm border-0 p-3">
                                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                                        <i class="bi bi-lightbulb fs-2 text-warning"></i>
                                                        <span class="badge bg-warning-subtle text-dark border">Course 2993511</span>
                                                    </div>
                                                    <h5 class="fw-bold">Entrepreneurship Development</h5>
                                                    <p class="text-muted small">Term Work: 50 Marks • Credits: 2</p>
                                                    <div class="small mb-3">
                                                        <span class="badge bg-light text-dark border me-1">6 Modules</span>
                                                        <span class="badge bg-light text-dark border me-1">10 Experiments</span>
                                                        <span class="badge bg-light text-dark border">6 Assignments</span>
                                                    </div>
                                                    <button class="btn btn-outline-primary btn-sm w-100" onClick={() => setActiveModal('ed')}>
                                                        <i class="bi bi-book me-1"></i> Open Detailed Syllabus
                                                    </button>
                                                </div>
                                            </div>

                                            {/* EVS Card */}
                                            <div class="col-md-6 col-xl-4">
                                                <div class="card course-card shadow-sm border-0 p-3">
                                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                                        <i class="bi bi-tree fs-2 text-success"></i>
                                                        <span class="badge bg-success-subtle text-success border">Course 2993512</span>
                                                    </div>
                                                    <h5 class="fw-bold">Environmental Science</h5>
                                                    <p class="text-muted small">Term Work: 50 Marks • Credits: 2</p>
                                                    <div class="small mb-3">
                                                        <span class="badge bg-light text-dark border me-1">6 Units</span>
                                                        <span class="badge bg-light text-dark border me-1">12 Experiments</span>
                                                        <span class="badge bg-light text-dark border">10 Assignments</span>
                                                    </div>
                                                    <button class="btn btn-outline-success btn-sm w-100" onClick={() => setActiveModal('evs')}>
                                                        <i class="bi bi-book me-1"></i> Open Detailed Syllabus
                                                    </button>
                                                </div>
                                            </div>

                                            {/* Other Sem III Courses */}
                                            {[
                                                { code: 'ITC301', title: 'Applied Mathematics Thinking-I', icon: 'bi-calculator', color: 'text-primary' },
                                                { code: 'ITC302', title: 'Advance Data Structure & Analysis', icon: 'bi-diagram-3', color: 'text-info' },
                                                { code: 'ITC303', title: 'Database Management System & App', icon: 'bi-database', color: 'text-danger' },
                                                { code: 'ITC304', title: 'Automata Theory', icon: 'bi-cpu', color: 'text-secondary' },
                                                { code: 'ITC305', title: 'Open Elective (Banking)', icon: 'bi-bank', color: 'text-warning' },
                                                { code: 'ITL301', title: 'Mini-Project: Full Stack Java', icon: 'bi-file-code', color: 'text-primary' }
                                            ].map(c => (
                                                <div class="col-md-6 col-xl-4" key={c.code}>
                                                    <div class="card course-card shadow-sm border-0 p-3">
                                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                                            <i class={`bi ${c.icon} fs-2 ${c.color}`}></i>
                                                            <span class="badge bg-light text-muted border">{c.code}</span>
                                                        </div>
                                                        <h5 class="fw-bold">{c.title}</h5>
                                                        <p class="text-muted small">Information Technology • Sem III</p>
                                                        <button class="btn btn-outline-secondary btn-sm w-100" onClick={() => alert(`${c.title} syllabus active in dashboard1.html`)}>
                                                            Course Details
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'attendance' && (
                                    <div>
                                        <div class="d-flex justify-content-between align-items-center mb-3">
                                            <div>
                                                <h3 class="fw-bold mb-0"><i class="bi bi-calendar2-check-fill text-primary me-2"></i>Attendance Statistics</h3>
                                                <small class="text-muted">Official Report: SE IT Div B (Period: 06/07/2026 To 04/09/2026)</small>
                                            </div>
                                            <button class="btn btn-outline-primary btn-sm" onClick={() => window.print()}>
                                                <i class="bi bi-printer me-1"></i> Print Report
                                            </button>
                                        </div>

                                        {/* Active Student Attendance Card */}
                                        <div class="card section-card p-4 mb-4 text-white shadow-sm" style={{ background: 'linear-gradient(135deg, #0f2744 0%, #174275 60%, #1e5ba3 100%)' }}>
                                            <div class="row align-items-center">
                                                <div class="col-md-8">
                                                    <h4 class="fw-bold mb-1">{currentStudent.name} ({currentStudent.fullName})</h4>
                                                    <p class="mb-2 text-light opacity-90 small">
                                                        Roll: {currentStudent.rollNo} • Moodle ID: {currentStudent.moodleId} • Department of Information Technology
                                                    </p>
                                                    <div class="d-flex flex-wrap gap-2">
                                                        <span class="badge bg-success-subtle text-success px-3 py-2">
                                                            Overall: {currentStudent.attendance.overallPct}% ({currentStudent.attendance.overallPct >= 75 ? 'Safe / Eligible' : 'Defaulter Risk'})
                                                        </span>
                                                        <span class="badge bg-info-subtle text-info px-3 py-2">
                                                            Theory: {currentStudent.attendance.theoryTotal.pct}% ({currentStudent.attendance.theoryTotal.attended} / 146)
                                                        </span>
                                                        <span class="badge bg-warning-subtle text-warning px-3 py-2">
                                                            Practical Avg: {currentStudent.attendance.practicalAvg}%
                                                        </span>
                                                    </div>
                                                </div>
                                                <div class="col-md-4 text-md-end mt-3 mt-md-0">
                                                    <div class="display-4 fw-bold text-warning">{currentStudent.attendance.overallPct}%</div>
                                                    <small class="text-light opacity-75">
                                                        {currentStudent.attendance.overallPct >= 75 ? 'Meets 75% Criteria' : 'Attendance Shortage (<75%)'}
                                                    </small>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Subject Table */}
                                        <div class="card section-card shadow-sm mb-4">
                                            <div class="card-header bg-white py-3 fw-bold">Subject-wise Attendance Breakdown</div>
                                            <div class="table-responsive">
                                                <table class="table table-hover align-middle mb-0">
                                                    <thead class="table-light">
                                                        <tr>
                                                            <th>Subject</th>
                                                            <th class="text-center">Conducted</th>
                                                            <th class="text-center">Attended</th>
                                                            <th style={{ minWidth: '180px' }}>Percentage</th>
                                                            <th class="text-center">Status</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>

                                            <li>Report on Role of IT in Environmental Protection.</li>

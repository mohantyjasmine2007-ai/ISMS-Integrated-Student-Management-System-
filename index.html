<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APSIT ISMS - Student Login | SE IT Div B</title>
    <link rel="icon" type="image/jpg" href="favicon.jpg">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-navy: #0f2744;
            --accent-blue: #1d5fbf;
            --accent-teal: #0891b2;
            --gold-accent: #f59e0b;
            --bg-light: #f3f6fb;
            --card-shadow: 0 20px 45px -10px rgba(15, 39, 68, 0.18);
        }

        body {
            background: linear-gradient(135deg, #0a1c33 0%, #102a4a 50%, #183e6b 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Background ambient glow shapes */
        .ambient-glow-1 {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(29, 95, 191, 0.28) 0%, rgba(29, 95, 191, 0) 70%);
            top: -100px;
            left: -100px;
            pointer-events: none;
        }
        .ambient-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(8, 145, 178, 0.22) 0%, rgba(8, 145, 178, 0) 70%);
            bottom: -120px;
            right: -100px;
            pointer-events: none;
        }

        .login-card {
            background: #ffffff;
            border: none;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .login-header {
            background: linear-gradient(135deg, #0b223d 0%, #16467d 60%, #1d5fbf 100%);
            color: white;
            padding: 34px 28px 28px;
            text-align: center;
            position: relative;
        }

        .logo-ring {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .logo-ring i {
            font-size: 34px;
            color: #f3ad06;
        }

        .login-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .login-subtitle {
            font-size: 13px;
            color: #d1e2f7;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .card-body {
            padding: 32px 30px 28px;
        }

        .form-label {
            color: #475569;
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            margin-bottom: 7px;
        }

        .input-group {
            border-radius: 12px;
            overflow: hidden;
            border: 1.5px solid #e2e8f0;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        .input-group:focus-within {
            border-color: #1d5fbf;
            box-shadow: 0 0 0 4px rgba(29, 95, 191, 0.12);
            background-color: #ffffff;
        }

        .input-group-text {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 17px;
            padding-left: 16px;
            padding-right: 10px;
        }

        .form-control {
            border: none;
            background: transparent;
            font-size: 14.5px;
            padding: 12px 14px 12px 4px;
            font-weight: 500;
            color: #1e293b;
        }

        .form-control:focus {
            background: transparent;
            box-shadow: none;
        }

        /* Login Portal Switcher Tabs */
        .portal-tabs {
            background: #e2e8f0;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 22px;
            display: flex;
            gap: 4px;
        }

        .portal-tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 9px 12px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .portal-tab-btn.active {
            background: #ffffff;
            color: #0f2744;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .portal-tab-btn:hover:not(.active) {
            color: #0f2744;
        }

        .btn-login {
            background: linear-gradient(135deg, #102a4a 0%, #16467d 50%, #1d5fbf 100%);
            color: white;
            border: none;
            padding: 13px;
            font-weight: 700;
            font-size: 15px;
            border-radius: 12px;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(16, 42, 74, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(29, 95, 191, 0.35);
            color: #ffffff;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .info-pill {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            font-size: 12px;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 18px;
        }

        #loginAlert {
            border-radius: 10px;
            font-size: 13px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="login-card">
        <div class="login-header">
            <div class="logo-ring">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h3 class="login-title">APSIT ISMS</h3>
            <p class="login-subtitle">Integrated Student Management System • SE IT Div B</p>
        </div>

        <div class="card-body p-4">
            <div id="loginAlert" class="alert alert-danger py-2 px-3 mb-3"></div>

            <!-- Portal Mode Selector -->
            <div class="portal-tabs">
                <button type="button" class="portal-tab-btn active" id="tabStudentBtn" onclick="switchLoginMode('student')">
                    <i class="bi bi-person-fill"></i> Student Portal
                </button>
                <button type="button" class="portal-tab-btn" id="tabFacultyBtn" onclick="switchLoginMode('faculty')">
                    <i class="bi bi-person-badge-fill"></i> Faculty Portal
                </button>
            </div>

            <!-- Student Login Form -->
            <form id="studentLoginForm" autocomplete="off">
                <div class="info-pill d-flex align-items-center">
                    <i class="bi bi-shield-lock-fill fs-5 me-2 text-primary"></i>
                    <div>
                        <strong>Confidential Student Access</strong>
                        <div style="font-size: 11px;">View your individual attendance, syllabi, grades & ID card</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="studentId">Moodle ID</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                        <input type="text" class="form-control" id="studentId" placeholder="Enter your 8-digit Moodle ID" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="studentPassword">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="studentPassword" placeholder="Enter your account password" required>
                        <button class="btn btn-link text-muted border-0 pe-3" type="button" id="toggleStudentPassword">
                            <i class="bi bi-eye" id="toggleStudentPasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-login w-100 mt-4" id="studentSubmitBtn">
                    <span>Sign In to Student Portal</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <!-- Faculty Login Form -->
            <form id="facultyLoginForm" autocomplete="off" style="display: none;">
                <div class="info-pill d-flex align-items-center" style="background: #f0fdf4; border-color: #bbf7d0; color: #166534;">
                    <i class="bi bi-award-fill fs-5 me-2 text-success"></i>
                    <div>
                        <strong>Faculty Academic Management</strong>
                        <div style="font-size: 11px;">Update student attendance & academic grades for SE IT Div B</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="facultyNameInput">Faculty Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-workspace"></i></span>
                        <input type="text" class="form-control" id="facultyNameInput" placeholder="Enter your full name" list="facultyDatalist" required>
                        <datalist id="facultyDatalist">
                            <option value="Prof. Puja Chavan">Applied Mathematics Thinking-I</option>
                            <option value="Dr. Sonia Aneesh">Advance Data Structure &amp; Analysis</option>
                            <option value="Prof. Shital Agarwal">Database Management &amp; SQL Lab</option>
                            <option value="Prof. Charul Singh">Automata Theory</option>
                            <option value="Prof. Anupama Singh">Open Elective &amp; ADSA Lab</option>
                            <option value="Prof. Mandar Ganjapurkar">Mini-Project Java</option>
                            <option value="Prof. Randeep Kaur Kahlon">Entrepreneurship Development</option>
                            <option value="Prof. Pranali Vhora">Environmental Science</option>
                        </datalist>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="facultyPassword">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="facultyPassword" placeholder="Enter your password" required>
                        <button class="btn btn-link text-muted border-0 pe-3" type="button" id="toggleFacultyPassword">
                            <i class="bi bi-eye" id="toggleFacultyPasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-login w-100 mt-4" id="facultySubmitBtn" style="background: linear-gradient(135deg, #064e3b 0%, #047857 50%, #059669 100%);">
                    <span>Access Faculty Portal</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>

        </div>
    </div>

    <!-- Load Students, Faculty and Attendance Data -->
    <script src="studentsData.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Tab switching logic
        function switchLoginMode(mode) {
            hideAlert();
            const tabStudentBtn = document.getElementById('tabStudentBtn');
            const tabFacultyBtn = document.getElementById('tabFacultyBtn');
            const studentForm = document.getElementById('studentLoginForm');
            const facultyForm = document.getElementById('facultyLoginForm');

            if (mode === 'student') {
                tabStudentBtn.classList.add('active');
                tabFacultyBtn.classList.remove('active');
                studentForm.style.display = 'block';
                facultyForm.style.display = 'none';
                document.getElementById('studentId').focus();
            } else {
                tabFacultyBtn.classList.add('active');
                tabStudentBtn.classList.remove('active');
                facultyForm.style.display = 'block';
                studentForm.style.display = 'none';
            }
        }

        // Student Password visibility toggle
        const toggleStudentPasswordBtn = document.getElementById('toggleStudentPassword');
        const studentPasswordInput = document.getElementById('studentPassword');
        const toggleStudentPasswordIcon = document.getElementById('toggleStudentPasswordIcon');

        toggleStudentPasswordBtn.addEventListener('click', function() {
            const isPassword = studentPasswordInput.getAttribute('type') === 'password';
            studentPasswordInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleStudentPasswordIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        });

        // Faculty Password visibility toggle
        const toggleFacultyPasswordBtn = document.getElementById('toggleFacultyPassword');
        const facultyPasswordInput = document.getElementById('facultyPassword');
        const toggleFacultyPasswordIcon = document.getElementById('toggleFacultyPasswordIcon');

        toggleFacultyPasswordBtn.addEventListener('click', function() {
            const isPassword = facultyPasswordInput.getAttribute('type') === 'password';
            facultyPasswordInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleFacultyPasswordIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        });

        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById('loginAlert');
            alertBox.textContent = msg;
            alertBox.className = isSuccess ? 'alert alert-success py-2 px-3 mb-3' : 'alert alert-danger py-2 px-3 mb-3';
            alertBox.style.display = 'block';
        }

        function hideAlert() {
            const alertBox = document.getElementById('loginAlert');
            alertBox.style.display = 'none';
        }

        document.getElementById('studentId').addEventListener('input', hideAlert);
        document.getElementById('studentPassword').addEventListener('input', hideAlert);
        document.getElementById('facultyNameInput').addEventListener('input', hideAlert);
        document.getElementById('facultyPassword').addEventListener('input', hideAlert);

        // Student Login Submission
        document.getElementById('studentLoginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            hideAlert();

            const studentId = document.getElementById('studentId').value.trim();
            const pass = document.getElementById('studentPassword').value.trim();

            if (!studentId || !pass) {
                showAlert('Please enter both your Moodle ID and Password.');
                return;
            }

            // Authenticate using the central student roster
            const authResult = authenticateStudent(studentId, pass);

            if (!authResult.success) {
                showAlert(authResult.message);
                return;
            }

            // Success state
            sessionStorage.setItem('apsit_auth_role', 'student');
            localStorage.setItem('apsit_auth_role', 'student');
            showAlert(`Welcome, ${authResult.student.name}! Redirecting to your dashboard...`, true);
            const submitBtn = document.getElementById('studentSubmitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span> Loading Dashboard...';

            setTimeout(() => {
                window.location.href = 'dashboard1.html';
            }, 600);
        });

        // Faculty Login Submission
        document.getElementById('facultyLoginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            hideAlert();

            const facultyName = document.getElementById('facultyNameInput').value.trim();
            const pass = document.getElementById('facultyPassword').value.trim();

            if (!facultyName || !pass) {
                showAlert('Please enter both your Faculty Name and Password.');
                return;
            }

            const authResult = authenticateFaculty(facultyName, pass);
            if (!authResult.success) {
                showAlert(authResult.message);
                return;
            }

            sessionStorage.setItem('apsit_auth_role', 'faculty');
            localStorage.setItem('apsit_auth_role', 'faculty');
            showAlert(`Welcome, ${authResult.faculty.title}! Loading Faculty Academic Portal...`, true);
            const submitBtn = document.getElementById('facultySubmitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span> Opening Faculty Portal...';

            setTimeout(() => {
                window.location.href = 'dashboard1.html?view=faculty';
            }, 600);
        });
    </script>
</body>
</html>
